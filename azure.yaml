# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json

name: functions-quickstart-powershell-azd-cosmosdb
metadata:
  template: functions-quickstart-powershell-azd-cosmosdb@1.0.0
services:
  api:
    project: .
    # NOTE: language is set to 'js' as a workaround -- azd has no built-in
    # packager for PowerShell. The 'js' packager uses generic ZIP packaging
    # which works for any runtime. The actual runtime is set via
    # FUNCTIONS_WORKER_RUNTIME=powershell in Bicep.
    language: js
    remoteBuild: false
    host: function
hooks:
  postprovision:
    windows:
      shell: pwsh
      run: .\infra\scripts\setuplocalenvironment.ps1
      interactive: true
      continueOnError: false
    posix:
      shell: sh
      run: ./infra/scripts/setuplocalenvironment.sh
      interactive: true
      continueOnError: false
